<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ファイブスター ビンゴ大会</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 1 column, phone first. Player card on top; host tools on a second tab. Warm orange union look. */
:root{
  --bg:#FFF6EA; --surface:#FFFFFF; --ink:#3B2418; --muted:#7A5A45; --line:#EBD3BC;
  --accent:#E8731A; --accent-ink:#3B2418; --deep:#B45309; --soft:#FDE8D3; --hit:#E8731A; --hit-ink:#3B2418;
  --good:#2F7D4F; --good-soft:#DDF0E3;
  --font-body:'Noto Sans JP',system-ui,sans-serif; --font-disp:'M PLUS Rounded 1c','Noto Sans JP',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2A1A12; --surface:#3A271C; --ink:#FFF1E2; --muted:#D9B99F; --line:#5A3E2E;
  --accent:#F08A3C; --accent-ink:#2A1A12; --deep:#F6B26B; --soft:#4A3022; --hit:#F08A3C; --hit-ink:#2A1A12;
  --good:#7FD3A0; --good-soft:#1F3A2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2A1A12; --surface:#3A271C; --ink:#FFF1E2; --muted:#D9B99F; --line:#5A3E2E;
  --accent:#F08A3C; --accent-ink:#2A1A12; --deep:#F6B26B; --soft:#4A3022; --hit:#F08A3C; --hit-ink:#2A1A12;
  --good:#7FD3A0; --good-soft:#1F3A2A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px;text-align:center}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--deep)}
h1{font-family:var(--font-disp);font-weight:900;font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--ink);font:700 15px var(--font-body);padding:10px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px}
.status b{font-family:var(--font-disp);font-size:22px}
.status.reach{background:var(--soft);border-color:var(--accent)}
.status.bingo{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status small{font-size:14px;color:var(--muted)}
.status.bingo small{color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}
.letters,.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.letters{margin-bottom:6px}
.letters span{font-family:var(--font-disp);font-weight:900;font-size:22px;text-align:center;color:var(--deep)}
.cell{aspect-ratio:1;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;
  font-family:var(--font-disp);font-weight:800;font-size:clamp(22px,7.5vw,32px);font-variant-numeric:tabular-nums;cursor:pointer;padding:0;position:relative}
.cell[aria-pressed="true"]{background:var(--hit);border-color:var(--hit);color:var(--hit-ink)}
.cell.line{box-shadow:0 0 0 3px var(--deep) inset}
.cell.free{font-size:15px;line-height:1.15}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--font-body);padding:12px 14px;border-radius:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:14px;color:var(--muted);margin:0}
.confirm{background:var(--soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-weight:700}
.confirm .actions .btn{min-width:110px}
.big{background:var(--ink);color:var(--bg);border-radius:24px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.big .lab{font-size:14px;font-weight:700;letter-spacing:.08em;opacity:.8}
.big .num{font-family:var(--font-disp);font-weight:900;font-size:120px;line-height:1.05;font-variant-numeric:tabular-nums}
.big .ltr{font-family:var(--font-disp);font-weight:900;font-size:36px;color:var(--accent)}
.recent{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:40px}
.recent span{font-family:var(--font-disp);font-weight:800;background:var(--soft);border-radius:999px;padding:4px 14px;font-size:18px}
.board{display:grid;grid-template-columns:auto repeat(15,minmax(0,1fr));gap:3px;align-items:center}
.board .bl{font-family:var(--font-disp);font-weight:900;color:var(--deep);padding-right:6px;font-size:16px}
.board i{font-style:normal;font-family:var(--font-disp);font-weight:700;font-size:11px;text-align:center;border-radius:6px;padding:4px 0;background:var(--surface);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.board i.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font-size:15px;color:var(--muted);text-align:center;margin:0}
[hidden]{display:none!important}
/* ---- host stage (tablet, shown to the room) ---- */
body.hm header{display:none}
body.hm{padding-block:10px 24px}
body.hm .wrap{max-width:1200px}
.hostgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stagecol{display:flex;flex-direction:column;gap:14px}
.sidecol{display:flex;flex-direction:column;gap:14px}
@media (min-width:860px) and (orientation:landscape){.hostgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.big{position:relative;overflow:hidden;justify-content:center;min-height:min(62vh,640px);border-radius:32px;padding:20px 16px;gap:0}
.big .lab{font-size:clamp(18px,3.2vh,28px)}
.big .ltr{font-size:min(15vh,22vw);line-height:1;letter-spacing:.04em}
.big .num{font-size:min(46vh,48vw);line-height:1;letter-spacing:-.02em}
.big.rolling .num{opacity:.55;filter:blur(1.5px)}
.big.rolling .ltr{opacity:.55}
.big.rolling .lab{color:var(--accent)}
.big.reveal{animation:flash 1.4s ease-out}
.big.reveal .num{animation:slam .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(.45)}100%{transform:scale(1)}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(232,115,26,.0);background:var(--accent)}30%{box-shadow:0 0 0 18px rgba(232,115,26,.35)}100%{box-shadow:0 0 0 0 rgba(232,115,26,0)}}
.btn.draw{font-size:clamp(24px,4.5vh,36px);padding:clamp(16px,3vh,26px) 14px;border-radius:22px;font-family:var(--font-disp);font-weight:900;letter-spacing:.06em}
.hostgrid .recent{justify-content:flex-start}
.hostgrid .recent span{font-size:clamp(22px,3.4vh,32px);padding:6px 18px}
.hostgrid .count{font-size:clamp(16px,2.4vh,20px);text-align:left}
.hostgrid .board i{font-size:clamp(12px,1.9vh,17px);padding:clamp(4px,.9vh,9px) 0}
.hostgrid .board .bl{font-size:clamp(18px,2.6vh,26px)}
.sndrow{display:flex;gap:10px;flex-wrap:wrap}
.sndrow .btn{min-width:0;font-size:14px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.big.reveal,.big.reveal .num{animation:none}.big.rolling .num{filter:none}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">ファイブスター労働組合　第29回定期大会　懇親会</span>
    <h1>ビンゴ大会</h1>
  </header>

  <div class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" id="tabPlayer" aria-selected="true">自分のカード</button>
    <button role="tab" id="tabHost" aria-selected="false">司会（抽選）</button>
  </div>

  <!-- player -->
  <section id="player" class="wrap" style="gap:14px">
    <div id="status" class="status"><div><b id="stMain">マスをタップしてみよう</b><br><small id="stSub">司会が読み上げた番号をタップ</small></div></div>
    <div class="card">
      <div class="letters"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
      <div id="grid" class="grid"></div>
    </div>
    <p class="hint">読み上げられた番号をタップすると色が付きます。間違えたらもう一度タップで戻せます。ビンゴになったら、この画面を司会に見せてください。</p>
    <div class="actions">
      <button class="btn" id="btnClear">印をリセット</button>
      <button class="btn" id="btnNew">カードを作り直す</button>
    </div>
    <div id="pConfirm" class="confirm" hidden>
      <p id="pConfirmMsg"></p>
      <div class="actions"><button class="btn primary" id="pYes">はい</button><button class="btn" id="pNo">やめる</button></div>
    </div>
  </section>

  <!-- host -->
  <section id="host" class="wrap" style="gap:14px" hidden>
    <div class="hostgrid">
      <div class="stagecol">
        <div class="big" id="stage" aria-live="polite">
          <span class="lab" id="hLab">まだ引いていません</span>
          <span class="ltr" id="hLtr">&nbsp;</span>
          <span class="num" id="hNum">--</span>
        </div>
        <button class="btn primary draw" id="btnDraw">次の番号を引く</button>
      </div>
      <div class="sidecol">
        <div class="recent" id="recent" aria-label="直近の番号"></div>
        <p class="count" id="hCount"></p>
        <div class="card"><div class="board" id="board"></div></div>
        <p class="hint">引いた番号は、声に出して読み上げてください（例「ビー、7番」）。参加者は自分のスマホで印を付けます。タブレットの音量を上げ、サイレントモードを切っておいてください。</p>
        <div class="sndrow">
          <button class="btn" id="btnSnd" aria-pressed="true">🔊 効果音：あり</button>
          <button class="btn" id="btnTest">音を試す</button>
          <button class="btn" id="btnUndo">1つ戻す</button>
          <button class="btn" id="btnReset">最初からやり直す</button>
        </div>
        <div id="hConfirm" class="confirm" hidden>
          <p>引いた番号をすべて消して、最初からやり直しますか？</p>
          <div class="actions"><button class="btn primary" id="hYes">やり直す</button><button class="btn" id="hNo">やめる</button></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  var LET=['B','I','N','G','O'];
  var store={};
  function get(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return store[k]||null}}
  function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){store[k]=v}}
  function $(id){return document.getElementById(id)}
  function letterOf(n){return LET[Math.floor((n-1)/15)]}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  /* ---- player ---- */
  var card=get('bingo-card'), marks=get('bingo-marks');
  function newCard(){
    var cols=[];
    for(var c=0;c<5;c++){var pool=[];for(var n=c*15+1;n<=c*15+15;n++)pool.push(n);cols.push(shuffle(pool).slice(0,5))}
    card=cols; marks=[]; for(var i=0;i<25;i++)marks.push(false); marks[12]=true;
    set('bingo-card',card); set('bingo-marks',marks);
  }
  if(!card||!marks||marks.length!==25)newCard();
  function numAt(i){var r=Math.floor(i/5),c=i%5;return card[c][r]}
  var LINES=[];
  for(var r=0;r<5;r++){var row=[];for(var c=0;c<5;c++)row.push(r*5+c);LINES.push(row)}
  for(var c2=0;c2<5;c2++){var col=[];for(var r2=0;r2<5;r2++)col.push(r2*5+c2);LINES.push(col)}
  LINES.push([0,6,12,18,24]);LINES.push([4,8,12,16,20]);
  function renderPlayer(){
    var g=$('grid'); g.textContent='';
    var done=[],reach=0;
    LINES.forEach(function(l){var k=l.filter(function(i){return marks[i]}).length;if(k===5)done.push(l);else if(k===4)reach++});
    var inLine={};done.forEach(function(l){l.forEach(function(i){inLine[i]=1})});
    for(var i=0;i<25;i++){
      var b=document.createElement('button');
      b.className='cell'+(i===12?' free':'')+(inLine[i]?' line':'');
      b.setAttribute('aria-pressed',marks[i]?'true':'false');
      if(i===12){b.innerHTML='FREE';b.setAttribute('aria-label','フリー（最初から開いています）')}
      else{b.textContent=numAt(i);b.setAttribute('aria-label',letterOf(numAt(i))+' '+numAt(i)+'番')}
      (function(idx){b.addEventListener('click',function(){
        if(idx===12)return; marks[idx]=!marks[idx]; set('bingo-marks',marks); renderPlayer();
      })})(i);
      g.appendChild(b);
    }
    var st=$('status'); st.className='status';
    if(done.length){st.classList.add('bingo');$('stMain').textContent='ビンゴ！'+(done.length>1?'（'+done.length+'列）':'');$('stSub').textContent='この画面を司会に見せてください'}
    else if(reach){st.classList.add('reach');$('stMain').textContent='リーチ！'+(reach>1?'（'+reach+'列）':'');$('stSub').textContent='あと1つでビンゴ'}
    else{var n=marks.filter(Boolean).length-1;$('stMain').textContent=n>0?n+'個 開きました':'マスをタップしてみよう';$('stSub').textContent='司会が読み上げた番号をタップ'}
  }
  var pAction=null;
  function askP(msg,fn){$('pConfirmMsg').textContent=msg;pAction=fn;$('pConfirm').hidden=false}
  $('btnClear').addEventListener('click',function(){askP('印をすべて消しますか？',function(){marks=marks.map(function(_,i){return i===12});set('bingo-marks',marks);renderPlayer()})});
  $('btnNew').addEventListener('click',function(){askP('新しいカードに作り直しますか？いまの印は消えます。',function(){newCard();renderPlayer()})});
  $('pYes').addEventListener('click',function(){if(pAction)pAction();pAction=null;$('pConfirm').hidden=true});
  $('pNo').addEventListener('click',function(){pAction=null;$('pConfirm').hidden=true});

  /* ---- host ---- */
  var drawn=get('bingo-drawn')||[];
  var rolling=false,ROLL=3000;
  function renderHost(){
    var last=drawn[drawn.length-1];
    $('hNum').textContent=last?last:'--';
    $('hLtr').innerHTML=last?letterOf(last):'&nbsp;';
    $('hLab').textContent=last?(drawn.length+'個目'):'まだ引いていません';
    var rec=$('recent');rec.textContent='';
    drawn.slice(-6,-1).reverse().forEach(function(n){var s=document.createElement('span');s.textContent=n;rec.appendChild(s)});
    $('hCount').textContent='引いた数：'+drawn.length+' / 75　残り '+(75-drawn.length);
    $('btnDraw').disabled=rolling||drawn.length>=75; $('btnUndo').disabled=rolling||drawn.length===0;
    var on={};drawn.forEach(function(n){on[n]=1});
    var bd=$('board');bd.textContent='';
    for(var r=0;r<5;r++){
      var l=document.createElement('span');l.className='bl';l.textContent=LET[r];bd.appendChild(l);
      for(var k=1;k<=15;k++){var n=r*15+k;var i=document.createElement('i');i.textContent=n;if(on[n])i.className='on';bd.appendChild(i)}
    }
  }

  /* ---- sound (WebAudio, no files) ---- */
  var AC=null,noiseBuf=null,soundOn=get('bingo-sound')!==false;
  function ac(){
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C()}catch(e){AC=null}}}
    if(AC&&AC.state==='suspended')AC.resume();
    if(AC&&!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    return AC;
  }
  function hit(t,vol,dur,freq){
    var src=AC.createBufferSource();src.buffer=noiseBuf;
    var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||2600;f.Q.value=.8;
    var g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t,Math.random()*.4,dur+.02);
  }
  function drumroll(sec){
    var t0=AC.currentTime+.05,t=0;
    while(t<sec){var p=t/sec;hit(t0+t,.12+.55*p,.075,2200+Math.random()*900);
      if(Math.round(t*1000/45)%2===0){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t0+t);o.frequency.exponentialRampToValueAtTime(90,t0+t+.06);g.gain.setValueAtTime(.15+.25*p,t0+t);g.gain.exponentialRampToValueAtTime(.001,t0+t+.08);o.connect(g);g.connect(AC.destination);o.start(t0+t);o.stop(t0+t+.1)}
      t+=.085-.045*p}
    return t0+sec;
  }
  function stab(t,len,vol){
    [98,196,293.7,392,587.3].forEach(function(fr,i){
      var o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();
      o.type='sawtooth';o.frequency.value=fr;
      lp.type='lowpass';lp.frequency.setValueAtTime(3600,t);lp.frequency.exponentialRampToValueAtTime(700,t+len);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*(i<2?.34:.16),t+.008);g.gain.exponentialRampToValueAtTime(.001,t+len);
      o.connect(lp);lp.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+len+.05);
    });
    var k=AC.createOscillator(),kg=AC.createGain();k.type='sine';
    k.frequency.setValueAtTime(130,t);k.frequency.exponentialRampToValueAtTime(48,t+.28);
    kg.gain.setValueAtTime(vol*1.1,t);kg.gain.exponentialRampToValueAtTime(.001,t+.34);
    k.connect(kg);kg.connect(AC.destination);k.start(t);k.stop(t+.4);
    hit(t,vol*.9,.14,1700);
  }
  function fanfare(t){
    stab(t,.2,.62);
    stab(t+.19,1.3,1);
    var src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=5500;
    var g=AC.createGain();g.gain.setValueAtTime(.0001,t+.19);g.gain.linearRampToValueAtTime(.35,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+1.3);
    src.connect(hp);hp.connect(g);g.connect(AC.destination);src.start(t+.19);src.stop(t+1.4);
  }
  function renderSnd(){var b=$('btnSnd');b.setAttribute('aria-pressed',soundOn?'true':'false');b.textContent=soundOn?'🔊 効果音：あり':'🔇 効果音：なし'}
  $('btnSnd').addEventListener('click',function(){soundOn=!soundOn;set('bingo-sound',soundOn);renderSnd();if(soundOn&&ac())fanfare(AC.currentTime+.05)});
  $('btnTest').addEventListener('click',function(){if(ac()){hit(AC.currentTime+.02,.5,.1);fanfare(AC.currentTime+.5)}});
  renderSnd();

  /* ---- draw with drumroll ---- */
  function setBusy(b){rolling=b;$('btnDraw').disabled=b||drawn.length>=75;$('btnUndo').disabled=b||drawn.length===0;$('btnReset').disabled=b}
  $('btnDraw').addEventListener('click',function(){
    if(rolling)return;
    var left=[];for(var n=1;n<=75;n++)if(drawn.indexOf(n)<0)left.push(n);
    if(!left.length)return;
    var pick=left[Math.floor(Math.random()*left.length)];
    var stage=$('stage');stage.classList.remove('reveal');stage.classList.add('rolling');
    setBusy(true);$('hLab').textContent='抽選中……';
    var useSnd=soundOn&&ac(),endAt=0;
    if(useSnd){drumroll(ROLL/1000);endAt=AC.currentTime+.05+ROLL/1000}
    var prev=0,iv=setInterval(function(){
      var x;do{x=left[Math.floor(Math.random()*left.length)]}while(x===prev&&left.length>1);prev=x;
      $('hNum').textContent=x;$('hLtr').textContent=letterOf(x);
    },65);
    setTimeout(function(){
      clearInterval(iv);
      if(useSnd)fanfare(Math.max(AC.currentTime,endAt));
      drawn.push(pick);set('bingo-drawn',drawn);
      stage.classList.remove('rolling');setBusy(false);renderHost();
      void stage.offsetWidth;stage.classList.add('reveal');
    },ROLL);
  });
  $('btnUndo').addEventListener('click',function(){drawn.pop();set('bingo-drawn',drawn);renderHost()});
  $('btnReset').addEventListener('click',function(){$('hConfirm').hidden=false});
  $('hNo').addEventListener('click',function(){$('hConfirm').hidden=true});
  $('hYes').addEventListener('click',function(){drawn=[];set('bingo-drawn',drawn);$('hConfirm').hidden=true;renderHost()});

  /* ---- tabs ---- */
  var hostOn=false;
  function show(mode){
    var h=mode==='host';
    if(h)hostOn=true;
    document.body.classList.toggle('hm',h);
    $('tabs').hidden=!hostOn;
    $('player').hidden=h;$('host').hidden=!h;
    $('tabPlayer').setAttribute('aria-selected',h?'false':'true');
    $('tabHost').setAttribute('aria-selected',h?'true':'false');
  }
  $('tabPlayer').addEventListener('click',function(){location.hash='';show('player')});
  $('tabHost').addEventListener('click',function(){location.hash='host';show('host')});
  window.addEventListener('hashchange',function(){show(location.hash==='#host'?'host':'player')});
  renderPlayer();renderHost();show(location.hash==='#host'?'host':'player');
})();
</script>

</body></html>
